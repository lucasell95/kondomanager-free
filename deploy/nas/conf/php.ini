memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 120
expose_php = Off
date.timezone = Europe/Rome
opcache.enable = 1
opcache.enable_cli = 0
; 48 MB non bastavano: il container di sviluppo, dopo un'ora d'uso, era a 47,6/48 MB con il
; buffer delle stringhe a 7,1/8. A cache piena PHP smette di memorizzare i file nuovi e li
; ricompila a OGNI richiesta: se mPDF arriva quando non c'è più posto, ogni stampa paga
; +130/180 ms su un Ryzen 3900X (misurato: estratto conto 187 -> 327 ms, distinta 130 -> 267 ms),
; parecchie volte tanto sulla CPU di un NAS. La memoria condivisa viene occupata solo quando
; serve davvero (oggi ~50-60 MB), quindi il limite più alto non costa RAM finché non si usa.
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
